        const calculatePriorityScore = (task, allTasks) => {
            let score = 0;
            
            // Importance Weight (0 - 40)
            const impMap = { 'Critical': 40, 'High': 30, 'Medium': 18, 'Low': 8 };
            score += impMap[task.importance] || 15;

            // Urgency Weight (0 - 30)
            const urgMap = { 'Critical': 30, 'High': 22, 'Medium': 14, 'Low': 5 };
            score += urgMap[task.urgency] || 10;

            // Deadline proximity weight (0 - 20)
            if (task.deadline) {
                const now = new Date();
                const due = new Date(task.deadline);
                const diffDays = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) score += 25; // Overdue bonus urgency
                else if (diffDays <= 3) score += 20;
                else if (diffDays <= 7) score += 12;
                else if (diffDays <= 14) score += 5;
            }

            // Dependency / Blocking Penalty
            const isBlocked = task.dependencies && task.dependencies.some(depId => {
                const parent = allTasks.find(t => t.id === depId);
                return parent && parent.status !== 'Done';
            });

            if (isBlocked) {
                score -= 35; // Strongly demote blocked tasks

                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.8 + 0.5,
                    alpha: Math.random() * 0.5 + 0.1,
                    speedY: - (Math.random() * 0.3 + 0.1),
                    speedX: (Math.random() - 0.5) * 0.2,
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX;

                        if (p.y < 0) {
                            p.y = canvas.height;
                            p.x = Math.random() * canvas.width;
                        }
                        if (p.x < 0 || p.x > canvas.width) p.x = Math.random() * canvas.width;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#D4AF37';
                        ctx.fill();
                    });

                    animationFrameId = requestAnimationFrame(render);
                };
                render();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} class="fixed inset-0 pointer-events-none z-0 opacity-40" />;
        };

                                    <h3 class="text-xl font-bold font-serif text-slate-100 mb-2 flex items-center gap-2">
                                        <i data-lucide="trophy" class="w-6 h-6 text-gold-400"></i>
                                        ACCOMPLISHMENTS LOG
                                    </h3>
                                    <p class="text-xs text-slate-400 mb-6">Archive of all completed milestones during this home leave.</p>

                                    <div class="space-y-3">
                                        {processedTasks.filter(t => t.status === 'Done').length > 0 ? (
                                            processedTasks.filter(t => t.status === 'Done').map(t => (
                                                <div key={t.id} class="glass-card bg-dark-950/60 p-4 rounded-xl border-emerald-500/20 flex items-center justify-between">
                                                    <div class="flex items-center space-x-3">
                                                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                                            <i data-lucide="check" class="w-4 h-4"></i>
                                                        </div>
                                                        <div>
                                                            <h4 class="text-sm font-bold text-slate-200">{t.title}</h4>
                                                            <div class="text-[10px] text-slate-400 mt-0.5">{t.category} • Completed</div>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => handleToggleTaskDone(t.id)}
                                                        class="text-xs text-slate-400 hover:text-gold-300 underline"
                                                    >
                                                        Undo Completion
                                                    </button>
                                                </div>
                                            ))
                                        ) : (
                                            <div class="text-center py-12">
                                                <i data-lucide="award" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
                                                <p class="text-sm text-slate-400">No tasks completed yet. Start execution to build your accomplishment streak!</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* MODALS AND DRAWERS */}

                    {/* 1. ADD / EDIT TASK MODAL */}
                    {isAddModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
                            <div class="glass-card bg-dark-900 border-gold-400/30 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 shadow-gold-glow">
                                <div class="flex items-center justify-between border-b border-gold-400/15 pb-4 mb-4">
                                    <h3 class="text-lg font-bold font-serif text-slate-100">
                                        {editingTask ? 'Edit Task Details' : 'Add New Home Leave Task'}
                                    </h3>
                                    <button onClick={() => setIsAddModalOpen(false)} class="text-slate-400 hover:text-slate-200">
                                        <i data-lucide="x" class="w-5 h-5"></i>
                                    </button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    handleSaveTask({
                                        id: editingTask ? editingTask.id : null,
                                        title: fd.get('title'),
                                        category: fd.get('category'),
                                        importance: fd.get('importance'),
                                        urgency: fd.get('urgency'),
                                        deadline: fd.get('deadline'),
                                        estimatedMinutes: parseInt(fd.get('estimatedMinutes')) || 60,
                                        status: fd.get('status'),
                                        nextAction: fd.get('nextAction'),
                                        notes: fd.get('notes'),
                                        dependencies: editingTask ? editingTask.dependencies : [],
                                        tags: ['UserTask'],
                                        isProject: false,
                                        subtasks: editingTask ? editingTask.subtasks : []
                                    });
                                }} class="space-y-4 text-xs">
                                    
                                    <div>
                                        <label class="block text-slate-300 font-semibold mb-1">Task Title *</label>
                                        <input 
                                            type="text" 
                                            name="title" 
                                            defaultValue={editingTask ? editingTask.title : ''}
                                            required 
                                            class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100 focus:border-gold-400"
                                        />
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Category</label>
                                            <select name="category" defaultValue={editingTask ? editingTask.category : 'Career'} class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100">
                                                {['Career', 'Courses', 'US Visa', 'Relationship', 'Personal', 'Family', 'Friends', 'Projects', 'Finance'].map(c => (
                                                    <option key={c} value={c}>{c}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Deadline Date</label>
                                            <input 
                                                type="date" 
                                                name="deadline" 
                                                defaultValue={editingTask ? editingTask.deadline : new Date().toISOString().split('T')[0]}
                                                class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                                            />
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-3 gap-3">
                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Importance</label>
                                            <select name="importance" defaultValue={editingTask ? editingTask.importance : 'High'} class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100">
                                                {['Critical', 'High', 'Medium', 'Low'].map(i => <option key={i} value={i}>{i}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Urgency</label>
                                            <select name="urgency" defaultValue={editingTask ? editingTask.urgency : 'Medium'} class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100">
                                                {['Critical', 'High', 'Medium', 'Low'].map(u => <option key={u} value={u}>{u}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Est. Minutes</label>
                                            <input 
                                                type="number" 
                                                name="estimatedMinutes" 
                                                defaultValue={editingTask ? editingTask.estimatedMinutes : 60}
                                                class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                                            />
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Status</label>
                                            <select name="status" defaultValue={editingTask ? editingTask.status : 'Not Started'} class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100">
                                                {['Not Started', 'In Progress', 'Waiting', 'Done', 'Cancelled'].map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label class="block text-slate-300 font-semibold mb-1">Next Concrete Action</label>
                                            <input 
                                                type="text" 
                                                name="nextAction" 
                                                defaultValue={editingTask ? editingTask.nextAction : ''}
                                                placeholder="Immediate next step..."
                                                class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label class="block text-slate-300 font-semibold mb-1">Notes & Context</label>
                                        <textarea 
                                            name="notes" 
                                            rows="3" 
                                            defaultValue={editingTask ? editingTask.notes : ''}
                                            class="w-full bg-dark-950 border border-slate-700 rounded-xl p-2.5 text-slate-100"
                                        ></textarea>
                                    </div>

                                    <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                                        {editingTask ? (
                                            <button 
                                                type="button" 
                                                onClick={() => handleDeleteTask(editingTask.id)}
                                                class="text-rose-400 hover:underline font-semibold"
                                            >
                                                Delete Task
                                            </button>
                                        ) : <div></div>}

                                        <div class="flex items-center space-x-2">
                                            <button 
                                                type="button" 
                                                onClick={() => setIsAddModalOpen(false)} 
                                                class="px-4 py-2 bg-dark-800 rounded-xl text-slate-300"
                                            >
                                                Cancel
                                            </button>
                                            <button 
                                                type="submit" 
                                                class="px-5 py-2 bg-gold-400 text-dark-950 rounded-xl font-bold hover:brightness-110"
                                            >
                                                Save Task
                                            </button>
                                        </div>
                                    </div>

                                </form>
                            </div>
                        </div>
                    )}

                    {/* 2. POMODORO / ACTIVE TASK TIMER WIDGET */}
                    {activeTimerTask && (
                        <div class="fixed bottom-20 md:bottom-6 right-4 z-40 glass-card bg-dark-900/95 border-gold-400/40 p-4 rounded-2xl shadow-gold-glow flex items-center space-x-4">
                            <div class="p-2.5 bg-gold-400/10 rounded-xl text-gold-400">
                                <i data-lucide="timer" class="w-6 h-6 animate-pulse"></i>
                            </div>
                            <div>
                                <div class="text-xs font-bold text-slate-200 max-w-[180px] truncate">
                                    {activeTimerTask.title}
                                </div>
                                <div class="text-lg font-bold font-serif text-gold-300 mt-0.5">
                                    {String(Math.floor(timerSeconds / 60)).padStart(2, '0')}:{String(timerSeconds % 60).padStart(2, '0')}
                                </div>
                            </div>

                            <div class="flex items-center space-x-1">
                                <button 
                                    onClick={() => setIsTimerRunning(!isTimerRunning)} 
                                    class="p-2 bg-dark-800 hover:bg-dark-700 text-slate-200 rounded-lg"
                                >
                                    <i data-lucide={isTimerRunning ? 'pause' : 'play'} class="w-4 h-4"></i>
                                </button>
                                <button 
                                    onClick={() => handleToggleTaskDone(activeTimerTask.id)} 
                                    class="p-2 bg-emerald-500 text-dark-950 font-bold rounded-lg text-xs"
                                >
                                    Finish
                                </button>
                                <button 
                                    onClick={() => setActiveTimerTask(null)} 
                                    class="p-2 text-slate-500 hover:text-slate-300"
                                >
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 3. AI ASSISTANT DRAWER */}
                    {isAiPanelOpen && (
                        <div class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm animate-fadeIn">
                            <div class="glass-card bg-dark-900 border-l border-gold-400/30 w-full max-w-md h-full p-6 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center justify-between border-b border-gold-400/15 pb-4 mb-4">
                                        <div class="flex items-center space-x-2">
                                            <i data-lucide="bot" class="w-5 h-5 text-gold-400"></i>
                                            <h3 class="text-lg font-bold font-serif text-slate-100">HOME LEAVE ASSISTANT</h3>
                                        </div>
                                        <button onClick={() => setIsAiPanelOpen(false)} class="text-slate-400 hover:text-slate-200">
                                            <i data-lucide="x" class="w-5 h-5"></i>
                                        </button>
                                    </div>

                                    <div class="space-y-3">
                                        <p class="text-xs text-slate-400">Select a prompt chip for immediate local execution insights:</p>
                                        {[
                                            "What should I do today?",
                                            "I have 3 hours free.",
                                            "What are my urgent tasks?",
                                            "What's blocking me?",
                                            "Show US Visa progress"
                                        ].map((chip, idx) => (
                                            <button 
                                                key={idx}
                                                onClick={() => {
                                                    showToast(`Assistant Response: Focus on P1 Critical items first!`, 'gold');
                                                }}
                                                class="w-full text-left p-3 rounded-xl bg-dark-950 border border-slate-800 text-xs font-semibold text-gold-300 hover:border-gold-400/40 transition-all"
                                            >
                                                ⚡ “{chip}”
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div class="pt-4 border-t border-slate-800 text-center text-[10px] text-slate-500">
                                    Local Executive Rules Engine Active • Offline Security Protected
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 4. EDIT LEAVE DATE MODAL */}
                    {isDateEditModalOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div class="glass-card bg-dark-900 border-gold-400/30 rounded-2xl p-6 w-full max-w-md">
                                <h3 class="text-lg font-bold font-serif text-slate-100 mb-2">Edit Home Leave Target Date</h3>
                                <p class="text-xs text-slate-400 mb-4">Change expected sign-off or departure target date:</p>
                                <input 
                                    type="date" 
                                    value={leaveDate}
                                    onChange={(e) => setLeaveDate(e.target.value)}
                                    class="w-full bg-dark-950 border border-slate-700 rounded-xl p-3 text-slate-100 mb-4"
                                />
                                <div class="flex justify-end space-x-2">
                                    <button onClick={() => setIsDateEditModalOpen(false)} class="px-4 py-2 text-xs bg-gold-400 text-dark-950 font-bold rounded-xl">
                                        Save & Update Countdown
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 5. TODAY'S BRIEFING MODAL */}
                    {isBriefingOpen && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                            <div class="glass-card bg-dark-900 border-gold-400/30 rounded-2xl p-6 w-full max-w-lg shadow-gold-glow">
                                <div class="flex justify-between items-center mb-4 border-b border-gold-400/15 pb-3">
                                    <h3 class="text-lg font-bold font-serif text-gold-300">☀️ TODAY'S EXECUTIVE BRIEFING</h3>
                                    <button onClick={() => setIsBriefingOpen(false)} class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                                </div>
                                <div class="space-y-3 text-xs text-slate-300">
                                    <p>• You have <strong class="text-gold-400">{metrics.remaining}</strong> remaining tasks overall.</p>
                                    <p>• <strong class="text-red-400">{metrics.highPriority}</strong> items are classified as P1/P2 high priority.</p>
                                    <p>• Recommended focus: Complete <strong>DG Shipping Profile update</strong> and <strong>US Visa DS-160</strong>.</p>
                                    <p>• Remember to preserve your <strong>7-day Girlfriend Time Block</strong> on the master calendar.</p>
                                </div>
                                <div class="mt-6 flex justify-end">
                                    <button onClick={() => setIsBriefingOpen(false)} class="px-5 py-2 bg-gold-400 text-dark-950 font-bold rounded-xl text-xs">
                                        Let's Execute
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MOBILE BOTTOM NAVIGATION BAR */}
                    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-card bg-dark-950/90 border-t border-gold-400/20 px-4 py-2.5 flex items-center justify-around md:hidden">
                        {[
                            { id: 'dashboard', label: 'Home', icon: 'home' },
                            { id: 'tasks', label: 'Tasks', icon: 'check-square' },
                            { id: 'calendar', label: 'Calendar', icon: 'calendar' },
                            { id: 'projects', label: 'Projects', icon: 'folder-git2' },
                        ].map(nav => (
                            <button
                                key={nav.id}
                                onClick={() => setActiveTab(nav.id)}
                                class={`flex flex-col items-center space-y-1 ${activeTab === nav.id ? 'text-gold-400 font-bold' : 'text-slate-500'}`}
                            >
                                <i data-lucide={nav.icon} class="w-5 h-5"></i>
                                <span class="text-[10px]">{nav.label}</span>
                            </button>
                        ))}
                        <button 
                            onClick={() => { setEditingTask(null); setIsAddModalOpen(true); }}
                            class="w-10 h-10 rounded-full bg-gold-400 text-dark-950 font-bold flex items-center justify-center shadow-gold-glow"
                        >
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </button>
                    </nav>

                </div>
            );
        };

        // Initialize Icons & Render App
        ReactDOM.createRoot(document.getElementById('root')).render(<HomeLeaveApp />);
        
        // Re-run lucide icons rendering
        setTimeout(() => {
            if (window.lucide) window.lucide.createIcons();
        }, 300);
    </script>
</body>
</html>
```
